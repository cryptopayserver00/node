services:
  app:
    image: viper00/node:0.0.1
    restart: always
    ports:
      - "8889:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      redis:
        condition: service_started
      memcached:
        condition: service_started
    networks:
      - shared-network

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - shared-network
  
  memcached:
    image: memcached:1.6-alpine
    restart: always
    networks:
      - shared-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "11211"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:

networks:
  shared-network:
    external: true