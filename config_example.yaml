# system configuration
system:
  env: debug # debug | release | test
  addr: 8080
  db-type: mysql
  use-redis: true
  use-memcache: true
  use-mongo: false
  use-init: true
  use-task: true
  iplimit-count: 15000
  iplimit-time: 3600
  router-prefix: "api"

# 服务间鉴权与跨域。api-token / sec-wss-token 为空时受保护接口与 WS 会直接拒绝。
security:
  api-token: "change-me"
  cors-allow-origins:
    - "http://localhost:3000"
  ws-allow-origins:
    - "http://localhost:3000"

# CoinGecko 价格源（逗号分隔多个 demo key）
coingecko:
  api-key: "CG-xxx"

blockchain:
  open-sweep-block: true
  sweep-mainnet: true
  inner-tx: false
  notify-mode: legacy # legacy=扫到即推送 | confirmed=确认后再推送
  ethereum: true
  bitcoin: true
  tron: true
  bsc: true
  litecoin: true
  op: false
  arbitrum-one: false
  arbitrum-nova: false
  solana: false
  ton: false
  xrp: false
  bch: false
  pol: false
  avax: false
  base: false

blockchain-plugin:
  bitcoin: "tatum" # tatum | mempool
  litecoin: "tatum" # tatum | mempool
  bitcoincash: "mempool" # tatum | mempool

# 资金事件 HTTP 回调。签名头：X-CryptoPay-Signature = sha256=HMAC(secret, timestamp + "." + body)
webhook:
  enabled: false
  urls:
    - "https://example.com/hooks/crypto"
  secret: "change-me-webhook-secret"
  timeout-seconds: 10

telegram:
  inform-bot-link:
  inform-bot-token:
  inform-channel-id:
  tx-inform-channel-id:

wss:
  sec-wss-token: "change-me-wss"

zap:
  level: info
  format: console
  prefix: "[node/server]"
  director: log
  show-line: true
  encode-level: LowercaseColorLevelEncoder
  stacktrace-key: stacktrace
  log-in-console: true
  max-age: 0

redis:
  db:
  addr:
  password: ""

memcache:
  addr:
  password: ""

mysql:
  prefix:
  singular: false
  path:
  port:
  config: charset=utf8mb4&parseTime=True
  db-name:
  username:
  password:
  max-idle-conns: 10
  max-open-conns: 100
  log-mode: error
  log-zap: false
  engine:

freecoin:
  # 生产务必保持 false；仅测试网 faucet 场景显式打开，并配合 api-token + max-amount
  enabled: false
  max-amount: "0.01"
  bitcoin:
    public_key: ""
    private_key: ""
    mnemonic: ""
  ethereum:
    public_key: ""
    private_key: ""
  solana:
    public_key: ""
    private_key: ""
    mnemonic: ""
  litecoin:
    public_key: ""
    private_key: ""
    mnemonic: ""
  tron:
    public_key: ""
    private_key: ""
    mnemonic: ""
  ton:
    public_key: ""
    mnemonic: ""
  xrp:
    public_key: ""
    private_key: ""
    mnemonic: ""
  bitcoincash:
    public_key: ""
    private_key: ""
    mnemonic: ""

coingecko:
  # comma-separated CoinGecko demo API keys
  api-key: ""

key:
  trongrid_mainnet_key: ""
  trongrid_nile_key: ""
  alchemy_mainnet_key: ""
  alchemy_inner_tx_mainnet_key: ""
  alchemy_inner_tx_testnet_key: ""
  alchemy_testnet_key: ""
  tatum_mainnet_key: ""
  tatum_testnet_key: ""

